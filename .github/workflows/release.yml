name: release

# Tag-driven release: pushing a `v*` git tag (typically via `npm version`) builds
# the container, publishes it to GHCR as `:vX.Y.Z` + `:latest`, and publishes
# the npm package. Day-to-day pushes to main and the weekly base-image refresh
# live in rebuild.yml — they keep `:latest` fresh but do not bump npm or mint
# version tags. Release cadence and security-refresh cadence are deliberately
# decoupled.
#
# Release flow:
#   npm version patch        # bumps package.json + commits + creates v* tag
#   git push --follow-tags   # pushes commit and tag together

on:
  push:
    tags: ['v*']
  # Allow manual dispatch *against an existing tag ref* (Run workflow -> pick
  # tag). The tag-guard step rejects branch dispatches so we can't accidentally
  # release main HEAD as a version that hasn't been tagged.
  workflow_dispatch:

permissions:
  contents: read

# Serialize every release globally and NEVER cancel one mid-flight: two versions
# publishing concurrently can race npm's `latest` dist-tag and GHCR's `:latest`.
# A kill between the GHCR push and `npm publish` could also leave a partial
# release; `queue: max` keeps later releases waiting instead of replacing a
# pending one, and the publish job below is deliberately restartable.
concurrency:
  group: aicontainer-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build multi-arch (no push, validates build)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: template
          platforms: linux/amd64,linux/arm64
          push: false
          tags: aicontainer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    uses: ./.github/workflows/smoke.yml

  publish:
    runs-on: ubuntu-latest
    needs: [build, smoke]
    # rebuild.yml mutates the same GHCR repository. This cross-workflow lock
    # covers the immutable-tag check/build and the final :latest promotion,
    # closing the check-then-push race with security-refresh publishes.
    concurrency:
      group: aicontainer-registry-publish
      cancel-in-progress: false
      queue: max
    outputs:
      is_npm_latest: ${{ steps.npm_latest.outputs.is_latest }}
    permissions:
      contents: read
      packages: write
      id-token: write  # for npm --provenance
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject non-tag refs
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "release.yml must run against a v* tag ref, got: $REF"; exit 1 ;;
          esac

      - name: Verify release commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "Release tag commit is not on ${DEFAULT_BRANCH}; refusing a version that security refreshes could later roll back." >&2
            exit 1
          fi

      - name: Derive version from tag
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          v="${REF_NAME#v}"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        env:
          TAG_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          pkg_v=$(node -p "require('./package.json').version")
          if [ "$pkg_v" != "$TAG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package.json $pkg_v"
            exit 1
          fi

      # The real gate: CHANGELOG.md is hand-maintained, and a release must not
      # ship without its notes. Fail here — before any GHCR/npm push — if the
      # tag's version has no `## [X.Y.Z]` section. The .githooks/pre-push hook
      # catches this locally too, but that's bypassable; this step is not.
      - name: Verify CHANGELOG.md has an entry for this version
        env:
          TAG_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          if ! grep -qE "^## \[${TAG_VERSION//./\\.}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$TAG_VERSION]' section — refusing to release."
            echo "Add the release notes for v$TAG_VERSION to CHANGELOG.md and re-tag."
            exit 1
          fi

      # Check npm before GHCR so an old, unannotated image tag can be treated
      # as a complete historical release only when its immutable npm tarball
      # independently proves that this exact tag was already published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check immutable npm version
        id: npm_version
        env:
          TAG_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          set -euo pipefail
          package=$(node -p "require('./package.json').name")
          local_json=$(npm pack --json --dry-run)
          # npm <= 11 prints an array with one entry; npm 12 prints an object
          # keyed by the package name. Accept exactly those two shapes and
          # fail on anything else, so a parse change can never compare an
          # empty or undefined integrity.
          local_integrity=$(printf '%s' "$local_json" \
            | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const name = process.argv[1];
                const j = JSON.parse(s);
                let entry;
                if (Array.isArray(j)) {
                  if (j.length === 1) entry = j[0];
                } else if (j && typeof j === "object") {
                  const keys = Object.keys(j);
                  if (keys.length === 1 && keys[0] === name) entry = j[name];
                }
                const integrity = entry && entry.name === name ? entry.integrity : undefined;
                if (typeof integrity !== "string" || !/^sha512-[A-Za-z0-9+\/]+={0,2}$/.test(integrity)) {
                  console.error("npm pack --json returned no sha512 integrity for " + name);
                  process.exit(1);
                }
                process.stdout.write(integrity);
              });
            ' "$package")

          err=$(mktemp)
          remote_json=
          if remote_json=$(npm view "${package}@${TAG_VERSION}" dist.integrity --json 2>"$err"); then
            remote_integrity=$(printf '%s' "$remote_json" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)))')
            if [ -z "$remote_integrity" ]; then
              echo "Registry returned no integrity for existing ${package}@${TAG_VERSION}." >&2
              exit 1
            fi
            if [ "$remote_integrity" != "$local_integrity" ]; then
              echo "${package}@${TAG_VERSION} exists but its immutable tarball does not match this tag." >&2
              echo "published: $remote_integrity" >&2
              echo "local:     $local_integrity" >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${package}@${TAG_VERSION} already exists with matching integrity; preserving it."
          elif { printf '%s\n' "$remote_json"; cat "$err"; } | grep -Eqi 'E404|404 Not Found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to determine whether ${package}@${TAG_VERSION} exists; refusing to publish blindly." >&2
            printf '%s\n' "$remote_json" >&2
            cat "$err" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable GHCR version tag
        id: ghcr_version
        env:
          TAG_VERSION: ${{ steps.ver.outputs.v }}
          NPM_VERSION_EXISTS: ${{ steps.npm_version.outputs.exists }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER}/aicontainer:v${TAG_VERSION}"
          err=$(mktemp)
          raw=$(mktemp)
          if docker buildx imagetools inspect "$image" --raw >"$raw" 2>"$err"; then
            revision=$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' "$raw")
            version=$(jq -r '.annotations["org.opencontainers.image.version"] // empty' "$raw")
            channel=$(jq -r '.annotations["io.aicontainer.channel"] // empty' "$raw")

            if [ "$revision" = "$GITHUB_SHA" ] \
              && [ "$version" = "v${TAG_VERSION}" ] \
              && [ "$channel" = release ]; then
              identity=verified
              echo "$image already exists with matching release identity; preserving the immutable tag."
            elif [ -z "$revision" ] && [ -z "$version" ] && [ -z "$channel" ]; then
              identity=legacy
              if [ "$NPM_VERSION_EXISTS" != true ]; then
                echo "$image is an unverified legacy tag and npm ${TAG_VERSION} is absent." >&2
                echo "Refusing partial recovery: the image cannot be tied to this release commit." >&2
                exit 1
              fi
              echo "$image has no release identity annotations, but the matching immutable npm version exists; preserving this legacy tag."
            else
              echo "$image exists but its immutable release identity does not match this tag." >&2
              printf 'expected revision: %q\n' "$GITHUB_SHA" >&2
              printf 'actual revision:   %q\n' "${revision:-<missing>}" >&2
              printf 'expected version:  %q\n' "v${TAG_VERSION}" >&2
              printf 'actual version:    %q\n' "${version:-<missing>}" >&2
              printf 'expected channel:  %q\n' release >&2
              printf 'actual channel:    %q\n' "${channel:-<missing>}" >&2
              exit 1
            fi
            {
              echo "exists=true"
              echo "identity=$identity"
            } >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|not found|name unknown' "$err"; then
            {
              echo "exists=false"
              echo "identity=new"
              echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Unable to determine whether $image exists; refusing to risk overwriting it." >&2
            cat "$err" >&2
            exit 1
          fi

      - name: Build and push immutable GHCR version
        if: steps.ghcr_version.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: template
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/aicontainer:v${{ steps.ver.outputs.v }}
          annotations: |
            index:org.opencontainers.image.created=${{ steps.ghcr_version.outputs.created }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=v${{ steps.ver.outputs.v }}
            index:io.aicontainer.channel=release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Choose npm dist-tag
        if: steps.npm_version.outputs.exists == 'false'
        id: npm_tag
        env:
          TAG_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          set -euo pipefail
          package=$(node -p "require('./package.json').name")
          err=$(mktemp)
          if current_json=$(npm view "$package" dist-tags.latest --json 2>"$err"); then
            current=$(printf '%s' "$current_json" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)||""))')
          elif { printf '%s\n' "$current_json"; cat "$err"; } | grep -Eqi 'E404|404 Not Found'; then
            current=
          else
            echo "Unable to read npm's current latest dist-tag; refusing to publish blindly." >&2
            printf '%s\n' "$current_json" >&2
            cat "$err" >&2
            exit 1
          fi

          # Never let recovery of an older tag move npm's `latest` backward.
          # Pre-releases use `next`; older stable releases get a version-specific
          # recovery tag, while a newer stable release becomes `latest` normally.
          version_without_build=${TAG_VERSION%%+*}
          if [[ "$version_without_build" == *-* ]]; then
            tag=next
          elif [ -z "$current" ] || node - "$TAG_VERSION" "$current" <<'NODE'
          const [candidate, current] = process.argv.slice(2);
          const parse = (value) => {
            const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(value);
            if (!match) throw new Error(`invalid semver: ${value}`);
            return { core: match.slice(1, 4).map(Number), pre: match[4]?.split('.') ?? [] };
          };
          const compare = (a, b) => {
            for (let i = 0; i < 3; i++) if (a.core[i] !== b.core[i]) return a.core[i] - b.core[i];
            if (!a.pre.length || !b.pre.length) return Number(!a.pre.length) - Number(!b.pre.length);
            for (let i = 0; i < Math.max(a.pre.length, b.pre.length); i++) {
              if (a.pre[i] === undefined) return -1;
              if (b.pre[i] === undefined) return 1;
              if (a.pre[i] === b.pre[i]) continue;
              const an = /^\d+$/.test(a.pre[i]);
              const bn = /^\d+$/.test(b.pre[i]);
              if (an && bn) return Number(a.pre[i]) - Number(b.pre[i]);
              if (an !== bn) return an ? -1 : 1;
              return a.pre[i] < b.pre[i] ? -1 : 1;
            }
            return 0;
          };
          process.exit(compare(parse(candidate), parse(current)) > 0 ? 0 : 1);
          NODE
          then
            tag=latest
          else
            tag="recovery-${TAG_VERSION//+/-}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing ${package}@${TAG_VERSION} with npm dist-tag '$tag' (current latest: ${current:-none})."

      - name: Publish missing version to npm
        if: steps.npm_version.outputs.exists == 'false'
        # Auth via npm OIDC Trusted Publishers (configured at npmjs.com).
        # The job already has `id-token: write`; npm CLI exchanges the GitHub
        # OIDC token for a short-lived publish token at runtime, so no
        # NODE_AUTH_TOKEN env var is needed.
        env:
          NPM_TAG: ${{ steps.npm_tag.outputs.tag }}
        run: npm publish --access public --provenance --tag "$NPM_TAG"

      - name: Promote immutable GHCR version when it is npm latest
        id: npm_latest
        env:
          TAG_VERSION: ${{ steps.ver.outputs.v }}
          GHCR_VERSION_IDENTITY: ${{ steps.ghcr_version.outputs.identity }}
          NPM_VERSION_EXISTS: ${{ steps.npm_version.outputs.exists }}
          NPM_PUBLISHED_TAG: ${{ steps.npm_tag.outputs.tag }}
        run: |
          set -euo pipefail
          package=$(node -p "require('./package.json').name")

          # Never read `latest` back from the registry right after publishing:
          # npm's read path is CDN-cached, so `npm view` keeps reporting the
          # previous version for a while after a successful publish. Trusting it
          # here left both GHCR `:latest` and the GitHub Release `Latest` badge
          # stuck on an old version. When this run published, the dist-tag it
          # used is authoritative — "Choose npm dist-tag" already did the
          # conservative semver comparison against the registry. Only a recovery
          # rerun that published nothing has to ask, and it races nothing.
          if [ "$NPM_VERSION_EXISTS" != true ]; then
            if [ "$NPM_PUBLISHED_TAG" = latest ]; then
              is_latest=true
              reason="published v${TAG_VERSION} as npm latest"
            else
              is_latest=false
              reason="published v${TAG_VERSION} with npm dist-tag '$NPM_PUBLISHED_TAG'"
            fi
          else
            npm_latest=$(npm view "$package" dist-tags.latest --json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)||""))')
            if [ "$npm_latest" = "$TAG_VERSION" ]; then
              is_latest=true
              reason="npm latest is already v${TAG_VERSION}"
            else
              is_latest=false
              reason="npm latest is $npm_latest"
            fi
          fi

          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
          if [ "$is_latest" != true ]; then
            echo "$reason; leaving GHCR :latest unchanged."
            exit 0
          fi
          echo "$reason."

          # A matching historical npm tarball lets an unannotated GHCR tag be
          # preserved for an idempotent rerun, but it does not prove the image
          # itself came from this commit. Never expand that legacy tag's reach
          # by newly assigning the floating :latest alias.
          if [ "$GHCR_VERSION_IDENTITY" = legacy ]; then
            echo "GHCR v${TAG_VERSION} is an unverified legacy tag; leaving :latest unchanged."
            exit 0
          fi

          version_image="ghcr.io/${OWNER}/aicontainer:v${TAG_VERSION}"
          latest_image="ghcr.io/${OWNER}/aicontainer:latest"
          version_digest=$(docker buildx imagetools inspect "$version_image" \
            --format '{{json .Manifest}}' | jq -r .digest)
          if latest_manifest=$(docker buildx imagetools inspect "$latest_image" \
              --format '{{json .Manifest}}' 2>/dev/null); then
            latest_digest=$(printf '%s' "$latest_manifest" | jq -r .digest)
            if [ "$latest_digest" = "$version_digest" ]; then
              echo "GHCR :latest already points at immutable v${TAG_VERSION}."
              exit 0
            fi

            image_created() {
              local image=$1 raw annotated fallback repository digest created newest
              raw=$(docker buildx imagetools inspect "$image" --raw)
              annotated=$(printf '%s' "$raw" \
                | jq -r '.annotations["org.opencontainers.image.created"] // empty')
              if [ -n "$annotated" ]; then
                printf '%s\n' "$annotated"
                return
              fi
              fallback=$(docker buildx imagetools inspect "$image" \
                --format '{{json .Image}}' 2>/dev/null \
                | jq -r '.created // empty' || true)
              if [ -n "$fallback" ]; then
                printf '%s\n' "$fallback"
                return
              fi

              # Older multi-platform tags predate index annotations. Resolve a
              # real platform manifest and read its image config as a fallback.
              repository=${image%:*}
              newest=
              while read -r digest; do
                [ -n "$digest" ] || continue
                created=$(docker buildx imagetools inspect "${repository}@${digest}" \
                  --format '{{json .Image}}' 2>/dev/null \
                  | jq -r '.created // empty' || true)
                if [ -n "$created" ] && { [ -z "$newest" ] || [[ "$created" > "$newest" ]]; }; then
                  newest=$created
                fi
              done < <(printf '%s' "$raw" | jq -r \
                '.manifests[]? | select(.platform.os != "unknown") | .digest')
              printf '%s\n' "$newest"
            }

            version_created=$(image_created "$version_image")
            latest_created=$(image_created "$latest_image")
            if [ -z "$version_created" ] || [ -z "$latest_created" ]; then
              echo "Cannot prove GHCR :latest is older than v${TAG_VERSION}; leaving it unchanged."
              echo "version created: ${version_created:-unknown}; latest created: ${latest_created:-unknown}"
              exit 0
            fi
            version_epoch=$(date -u -d "$version_created" +%s)
            latest_epoch=$(date -u -d "$latest_created" +%s)
            if [ "$latest_epoch" -gt "$version_epoch" ]; then
              echo "GHCR :latest is a newer security-refresh image; leaving it unchanged."
              exit 0
            fi
          fi

          # Copy the already-published immutable manifest; never rebuild or
          # push directly to both tags, which could make them differ on rerun.
          docker buildx imagetools create --tag "$latest_image" "$version_image"

  # Create the GitHub Release only after GHCR + npm succeed, so a Release never
  # points at a failed publish. Notes are the tag's section from the hand-
  # maintained CHANGELOG.md (the publish job already guaranteed it exists); we
  # still fall back to auto-generated notes defensively. This job needs
  # `contents: write` (the publish job stays read-only). No tag guard is needed:
  # it `needs: publish`, which already rejects non-tag refs.
  github-release:
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    env:
      REF_NAME: ${{ github.ref_name }}
      IS_NPM_LATEST: ${{ needs.publish.outputs.is_npm_latest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract this version's CHANGELOG section
        run: |
          ver="${REF_NAME#v}"
          # Print lines under "## [ver]" up to the next "## " heading or the
          # trailing "[link]: url" reference block. (GitHub trims the blank
          # edges when it renders the release body.)
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 { flag = 1; next }
            /^## / { flag = 0 }
            /^\[[^]]+\]:[[:space:]]/ { flag = 0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md || true
          if [ -s RELEASE_NOTES.md ] && grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "found=1" >> "$GITHUB_ENV"
          else
            echo "found=0" >> "$GITHUB_ENV"
            echo "No CHANGELOG section for $ver; will use auto-generated notes."
          fi
      - name: Create GitHub Release (idempotent)
        run: |
          if gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $REF_NAME already exists; skipping."
            exit 0
          fi
          latest=--latest=false
          if [ "$IS_NPM_LATEST" = "true" ]; then
            latest=--latest
          fi
          if [ "$found" = "1" ]; then
            gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$REF_NAME" --verify-tag "$latest" --notes-file RELEASE_NOTES.md
          else
            gh release create "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$REF_NAME" --verify-tag "$latest" --generate-notes
          fi
